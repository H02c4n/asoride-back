# Asoride v2 — Docker Compose
# Tüm backend servisleri aynı env anchor'ı paylaşır.

x-backend-env: &backend-env
  DJANGO_ENV: development
  SECRET_KEY: ${SECRET_KEY:-django-insecure-asoride-dev}
  DEBUG: ${DEBUG:-True}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
  DB_NAME: ${DB_NAME:-asoride}
  DB_USER: ${DB_USER:-asoride_user}
  DB_PASSWORD: ${DB_PASSWORD:-asoride_pass}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_USERNAME: ${KAFKA_USERNAME:-}
  KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
  KAFKA_CA_CERT: ${KAFKA_CA_CERT:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}

services:
  # ==========================================================
  # Veritabanı — PostGIS
  # ==========================================================
  db:
    image: postgis/postgis:15-3.3
    container_name: asoride-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-asoride}
      POSTGRES_USER: ${DB_USER:-asoride_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asoride_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asoride_user} -d ${DB_NAME:-asoride}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # Redis — Channels + Cache
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: asoride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ==========================================================
  # Kafka — KRaft modu
  # ==========================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: asoride-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ==========================================================
  # Django + Daphne (HTTP + WebSocket)
  # ==========================================================
  backend:
    build: .
    container_name: asoride-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  # ==========================================================
  # Kafka Consumer — Analytics
  # ==========================================================
  analytics-worker:
    build: .
    container_name: asoride-analytics-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *backend-env
    volumes:
      - .:/app
    command: python manage.py run_analytics_consumer

volumes:
  postgres_data:
  kafka_data: